spring:
  application:
    name: taskflow-api

  # Perfil por defecto: H2 en memoria. Arranca sin instalar nada.
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false          # evita consultas perezosas fuera de la capa de servicio
    defer-datasource-initialization: true   # data.sql corre despues de que Hibernate crea el esquema
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always               # ejecuta data.sql al arrancar

server:
  # Railway (y la mayoria de PaaS) inyectan el puerto por la variable PORT.
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Origenes permitidos para el cliente React (ver WebCorsConfig).
# En despliegue se sobrescribe con la variable TASKFLOW_CORS_ALLOWED_ORIGINS.
taskflow:
  cors:
    allowed-origins: ${TASKFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

---
# Perfil de produccion: PostgreSQL. Activar con --spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # "update" mantiene el esquema al dia sin borrar datos entre despliegues.
      # Un proyecto con esquema estable migraria a Flyway; aqui basta y evita
      # que el primer arranque falle contra una base recien creada y vacia.
      ddl-auto: update
  sql:
    init:
      mode: always
      # data.sql usa DATEADD, exclusivo de H2. Postgres necesita su propio seed,
      # ademas idempotente: la base persiste y el script corre en cada arranque.
      data-locations: classpath:data-postgres.sql
