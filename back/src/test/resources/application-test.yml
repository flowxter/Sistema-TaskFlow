# Configuracion exclusiva de pruebas: base en memoria aislada y sin logs de SQL.
spring:
  datasource:
    url: jdbc:h2:mem:taskflow-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: WARN
